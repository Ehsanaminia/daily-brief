# Studio + publisher. Runs free on GitHub (public repo).
# When episode scripts land on main, it builds the MP3s (edge-tts + ffmpeg), puts them in
# GitHub Releases, rebuilds the podcast feed and publishes the site to GitHub Pages.
# Only episodes whose meta.json says "publish": true are built.
name: Publish episodes

on:
  push:
    branches: [main]
    paths: ["episodes/**", "build/**", "assets/**", ".github/workflows/publish.yml"]
  workflow_dispatch: {}

permissions:
  contents: write   # create releases, save audio info back into meta.json
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts==7.3.1 pillow==11.3.0
      - name: Build and upload new episodes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build/publish.py
      - name: Save audio info
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes/*/meta.json
          git diff --cached --quiet || { git commit -m "Record published audio [skip ci]" && git push; }
      - name: Build feed and site
        run: |
          python build/make_feed.py _site
          python build/make_art.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
